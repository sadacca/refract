name: Generate Candidate Reference Examples

on:
  workflow_dispatch:
    inputs:
      bias_id:
        description: "Specific bias ID to generate examples for (leave blank for all pending)"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate candidate examples
        run: |
          BIAS_ARG=""
          if [ -n "${{ inputs.bias_id }}" ]; then
            BIAS_ARG="--bias-id ${{ inputs.bias_id }}"
          fi
          python scripts/precompute_examples.py --status pending $BIAS_ARG

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending_examples/
          git diff --staged --quiet || \
            git commit -m "examples: generate candidates for pending bias entries"
          git push origin main
