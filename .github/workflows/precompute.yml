name: Precompute Taxonomy Artifacts

on:
  push:
    paths:
      - "bias_index/taxonomy.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run precompute
        run: python scripts/precompute.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precomputed/
          git diff --staged --quiet || \
            git commit -m "precompute: update artifacts for taxonomy $(python -c 'import json; print(json.load(open(\"bias_index/taxonomy.json\"))[\"version\"])')"

      - name: Push
        run: git push origin HEAD
