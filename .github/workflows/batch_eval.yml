name: Batch Article Evaluation

on:
  workflow_dispatch:
    inputs:
      url_file:
        description: "Path to URL list"
        default: "data/input/article_urls.txt"
        required: false
      eval_model:
        description: "Classification model — Pass 2 identification (eval). Groq models: llama-3.3-70b-versatile, llama-3.1-8b-instant. Gemini: gemini-2.0-flash, gemini-1.5-pro."
        default: "llama-3.3-70b-versatile"
        required: false
      judge_model:
        description: "Judge model — Pass 4 verdict (judge). Leave empty for auto cross-family: Groq eval → gemini-2.5-flash-lite (15 RPM/1000 RPD free), Gemini eval → llama-3.3-70b-versatile. Override: gemini-2.5-flash, gemini-2.5-pro, etc."
        default: ""
        required: false
      skip_cached:
        description: "Skip articles already evaluated with this exact eval+judge model combination"
        type: boolean
        default: true
        required: false
      max_articles:
        description: "Max articles to process (0 = unlimited)"
        default: "0"
        required: false
      eval_mode:
        description: "deep: Pass 1 triage + Pass 3 recall probes; flat: Pass 2 on all categories (no triage)"
        type: choice
        options:
          - deep
          - flat
        default: deep
        required: false

permissions:
  contents: write

concurrency:
  group: batch-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_MODEL: ${{ inputs.eval_model || 'llama-3.3-70b-versatile' }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      TRIAGE_MODEL: llama-3.1-8b-instant

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify precomputed artifacts are current
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          idx = Path('data/precomputed/taxonomy_index.json')
          if not idx.exists():
              print('ERROR: data/precomputed/taxonomy_index.json missing. Run precompute workflow first.')
              sys.exit(1)
          print('Precomputed artifacts found.')
          "

      - name: Verify URLs are fetchable (spot check first URL)
        run: |
          python -c "
          import sys, requests, trafilatura
          from pathlib import Path
          urls = [l.strip() for l in Path('data/input/article_urls.txt').read_text().splitlines()
                  if l.strip() and not l.startswith('#')]
          if not urls:
              print('WARNING: article_urls.txt has no URLs — nothing to evaluate')
              sys.exit(0)
          url = urls[0]
          print(f'Spot-checking: {url}')
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; Refract/0.1; +https://github.com/sadacca/refract)'}
          try:
              r = requests.get(url, headers=headers, timeout=20)
              text = trafilatura.extract(r.text)
              if text:
                  print(f'OK: extracted {len(text.split())} words')
              else:
                  print(f'WARNING: URL returned HTTP {r.status_code} but trafilatura extracted no text')
                  print('Check that URLs point to individual articles, not hub/index pages')
          except Exception as e:
              print(f'WARNING: fetch failed — {e}')
              print('Articles may still evaluate if other URLs work')
          "

      - name: Run batch evaluation
        run: |
          MAX_ARG=""
          if [ "${{ inputs.max_articles }}" != "0" ] && [ -n "${{ inputs.max_articles }}" ]; then
            MAX_ARG="--max ${{ inputs.max_articles }}"
          fi
          SKIP_ARG="--skip-cached"
          if [ "${{ inputs.skip_cached }}" = "false" ]; then
            SKIP_ARG="--no-skip-cached"
          fi
          python scripts/batch_eval.py \
            --url-file "${{ inputs.url_file || 'data/input/article_urls.txt' }}" \
            --mode "${{ inputs.eval_mode || 'deep' }}" \
            $SKIP_ARG \
            $MAX_ARG

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          MSG=$(python -c "from config import FRAMEWORK_VERSION, EVAL_MODEL, JUDGE_MODEL, model_abbrev; print(f'fw {FRAMEWORK_VERSION} | eval={model_abbrev(EVAL_MODEL)} judge={model_abbrev(JUDGE_MODEL)}')")
          git diff --staged --quiet || git commit -m "batch: evaluate articles [$MSG]"
          git push origin HEAD
